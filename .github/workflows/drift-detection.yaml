name: OpenTofu Drift Detection

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    env:
      AWS_PROFILE: ""
      TF_VAR_account_id: ecb38e99c15d28c64e8794aeca162eac
      TF_VAR_zone_id: f3528c90e0b1c9516a279b76be10da07
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://ecb38e99c15d28c64e8794aeca162eac.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - run: tofu init -input=false -no-color
        working-directory: opentofu
      - id: drift
        run: |
          set +e
          tofu plan -detailed-exitcode -no-color -input=false > drift_plan.txt 2>&1
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 2 ]; then
            echo "Drift detected!"
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
          elif [ "$exit_code" -ne 0 ]; then
            echo "::error::OpenTofu plan failed with exit code $exit_code"
            exit "$exit_code"
          fi
        working-directory: opentofu
      - if: env.DRIFT_DETECTED == 'true'
        id: find-issue
        run: |
          issue_number=$(gh issue list \
            --label "drift" \
            --label "automated-issue" \
            --state "open" \
            --search "🚨 OpenTofu Infrastructure Drift Detected in:title" \
            --json number \
            -q '.[0].number')
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DRIFT_DETECTED == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710
        with:
          title: "🚨 OpenTofu Infrastructure Drift Detected"
          issue-number: ${{ steps.find-issue.outputs.issue_number }}
          content-filepath: opentofu/drift_plan.txt
          labels: |
            drift
            infrastructure
            automated-issue
